# 自动把 Lingua Link 下载落地页部署到 GitHub Pages
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing          # 下载落地页在 landing 分支
      - name: Stage download page
        run: mkdir -p _site && cp index.html _site/   # upload-pages-artifact 必须传目录
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site           # 目录（里面是 index.html，自包含落地页）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
