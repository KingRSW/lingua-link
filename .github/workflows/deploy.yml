# 自动把 Lingua Link 下载落地页部署到 GitHub Pages
# 用法：把本工程推送到 GitHub 的 main 分支，GitHub 会自动发布「下载安装包」落地页。
# 落地页是单文件（landing/index.html，自包含），不部署 Flutter 网页版（避免和下载页抢同一网址）。
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing          # 下载落地页在 landing 分支
      - uses: actions/upload-pages-artifact@v3
        with:
          path: index.html      # 单文件落地页（自包含，含内嵌二维码）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
